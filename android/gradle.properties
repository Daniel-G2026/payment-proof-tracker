org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Run Kotlin compilation in the Gradle worker instead of spawning a separate
# daemon. Works around a Kotlin 2.0.x + JDK 21 daemon crash on Windows where
# the daemon exits with code 0 immediately after reporting "ready".
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
