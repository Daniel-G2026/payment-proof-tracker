name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't wait
# behind a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite is hermetic: tests use in-memory SQLite and fakeredis, and
    # tests/conftest.py supplies safe defaults, so no service containers are
    # needed here.
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
